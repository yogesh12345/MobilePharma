apply plugin: 'com.android.application'

// Keep a direct `gradlew assembleRelease` build in sync with the web app.
// Capacitor otherwise packages the last bundle copied into src/main/assets.
def webProjectDir = rootProject.file('..')
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('buildWebApp', Exec) {
    workingDir webProjectDir
    commandLine npmCommand, 'run', 'build'
    inputs.dir(new File(webProjectDir, 'src'))
    inputs.dir(new File(webProjectDir, 'public'))
    inputs.file(new File(webProjectDir, 'package.json'))
    inputs.file(new File(webProjectDir, 'package-lock.json'))
    outputs.dir(new File(webProjectDir, 'dist'))
}

tasks.register('syncWebAssets', Sync) {
    dependsOn 'buildWebApp'
    from new File(webProjectDir, 'dist')
    into new File(projectDir, 'src/main/assets/public')
}

tasks.named('preBuild') {
    dependsOn 'syncWebAssets'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "in.co.meenaagencies.pharmasys"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "in.co.meenaagencies.pharmasys"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        versionCode 7
        versionName "1.3.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            // Files and directories to omit from packaged web assets
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')

    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info(
        "google-services.json not found, google-services plugin not applied. " +
        "Push Notifications won't work"
    )
}
