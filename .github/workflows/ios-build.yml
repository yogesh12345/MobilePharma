name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React/Vite app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app for Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS Simulator app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*/Build/Products/Debug-iphonesimulator/App.app" \
            -print -quit)

          echo "App found at: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "App.app was not found"
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            PharmaSys-Mobile-iOS-Simulator.zip

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: PharmaSys-Mobile-iOS-Simulator
          path: PharmaSys-Mobile-iOS-Simulator.zip
          retention-days: 14