# Existing pharma-server Nginx listener behind the public HTTPS proxy.
server {
    listen 8082;
    listen [::]:8082;
    server_name localhost;

    root /var/www/mobilepharma;
    index index.html;

    # The deployed mobile bundle requests this path. Reuse the existing Go
    # current-stock endpoint until the Go mobile route is deployed.
    location ~ ^/mobile/stock/current/([0-9]+)$ {
        rewrite ^/mobile/stock/current/([0-9]+)$ /stock/current/$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/(login|me|mobile|so|api|item|customers|stock|output|public-assets|qrcodes|barcodes|reports)(/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
