# Place these locations inside the HTTPS server block for
# mobile.meenaagencies.co.in. The build contents go in /var/www/mobilepharma/.
root /var/www/mobilepharma;

# Keep browser API calls on the mobile hostname. The backend must allow
# https://mobile.meenaagencies.co.in in CORS_ALLOW_ORIGINS.
location ~ ^/(login|me|mobile|so|api|item|customers|stock|output|public-assets|qrcodes|barcodes|reports)(/|$) {
    proxy_pass https://back.meenaagencies.co.in;
    proxy_ssl_server_name on;
    proxy_set_header Host back.meenaagencies.co.in;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /index.html {
    add_header Cache-Control "no-cache" always;
}

location = /sw.js {
    add_header Cache-Control "no-cache" always;
}

location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    try_files $uri $uri/ /index.html;
}
