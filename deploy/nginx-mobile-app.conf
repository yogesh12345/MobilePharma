# Add these locations inside the existing HTTPS server block for the API host.
# Copy the browser build into /var/www/mobile-app/ (index.html at this path).
location = /mobile-app {
    return 301 /mobile-app/;
}

location = /mobile-app/index.html {
    root /var/www;
    add_header Cache-Control "no-cache" always;
}

location = /mobile-app/sw.js {
    root /var/www;
    add_header Cache-Control "no-cache" always;
}

location ^~ /mobile-app/assets/ {
    root /var/www;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /mobile-app/ {
    root /var/www;
    try_files $uri $uri/ /mobile-app/index.html;
}
